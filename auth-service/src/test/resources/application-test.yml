spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:h2:mem:authdb;MODE=MYSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
  flyway:
    enabled: false
  security:
    basic:
      enabled: false

# Contratto di identita' condiviso: nei test il config-server non esiste,
# quindi issuer, secret e durate vanno dichiarati qui.
security:
  jwt:
    issuer: auth-service
    secret: test-secret-test-secret-test-secret-1234
    access-token-ttl: 15m
    refresh-token-ttl: 7d